name: Daily Threat Hunt

on:
  schedule:
    # Run daily at 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no Discord/Notion posts)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  threat-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || '1332616096825606164' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Threat Hunt Bot
        run: |
          python -m src.main
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            logs/
          retention-days: 7
      
      - name: Discord Error Notification
        if: failure()
        run: |
          python -c "
          import os
          import json
          import requests
          
          import discord
          import asyncio
          
          bot_token = os.environ.get('DISCORD_BOT_TOKEN')
          channel_id = os.environ.get('DISCORD_CHANNEL_ID', '1332616096825606164')
          
          if bot_token and channel_id:
              async def send_error():
                  client = discord.Client(intents=discord.Intents.default())
                  await client.login(bot_token)
                  channel = client.get_channel(int(channel_id))
                  if channel:
                      await channel.send('⚠️ **GitHub Actions Alert** ⚠️\n\nThe Daily Threat Hunt workflow failed!\n\n**Workflow:** ${{ github.workflow }}\n**Run ID:** ${{ github.run_id }}\n**Error:** Check GitHub Actions logs for details.\n\n[View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})')
                  await client.close()
              
              asyncio.run(send_error())
          "
